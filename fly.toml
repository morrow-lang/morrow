# Fly.io configuration for the public Morrow checklist demo.
#
# The demo is one static x86-64 server process. Rooms have fixed owners inside
# that process, so keep exactly one machine: `fly deploy --ha=false` and never
# scale the count above one. See docs/DEPLOY.md.
app = "morrow-demo"
primary_region = "ams"

[build]
  dockerfile = "deploy/fly/Dockerfile"

[env]
  MORROW_WEB_BIND = "0.0.0.0:8080"
  MORROW_WEB_ORIGIN = "https://morrow-demo.fly.dev"
  MORROW_WEB_DATA_DIR = "/data"
  MORROW_WEB_WORKERS = "2"

[http_service]
  internal_port = 8080
  force_https = true
  # Idle: Fly Proxy suspends this Machine after several minutes with no traffic.
  # The next request resumes it (or cold-starts after a deploy). Volume billing remains.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[mounts]
  source = "morrow_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"

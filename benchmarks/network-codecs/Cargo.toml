[package]
name = "morrow-network-codecs"
version = "0.0.0"
edition = "2024"
rust-version = "1.100"
publish = false
default-run = "morrow-network-codecs"
[lib]
crate-type = ["rlib", "cdylib"]
[features]
browser-json = ["dep:wasm-bindgen"]
browser-cbor = ["dep:wasm-bindgen"]
browser-protobuf = ["dep:wasm-bindgen"]
[workspace]
[dependencies]
morrow-web-protocol = { path = "../../crates/morrow-web-protocol" }
serde_json = "=1.0.151"
minicbor = { version = "=2.3.0", features = ["std", "derive"] }
prost = { version = "=0.14.4", default-features = false, features = ["derive", "std"] }
wasm-bindgen = { version = "=0.2.128", optional = true }
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = "=0.2.189"
[profile.release]
strip = true
lto = "thin"
codegen-units = 1
[profile.dev]
debug = 0
incremental = false
[profile.test]
debug = 0
incremental = false

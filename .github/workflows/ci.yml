name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  rust-workspace:
    name: Rust workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.1
          install: true
      - name: Check compiler, runtime, tooling and native programs
        run: cargo xtask check
      - name: Simulate and replay a month of application virtual time
        run: |
          cargo xtask simulate --seed 0xc0ffee --steps 3000 --days 30 --json > fern-simulation.json 2> fern-simulation.stderr.log
          cargo xtask simulate --replay fern-simulation.json
          cargo xtask simulate --actors --seed 0xc0ffee --steps 5000 --json > fern-actor-simulation.json 2> fern-actor-simulation.stderr.log
          cargo xtask simulate --replay fern-actor-simulation.json
      - name: Retain deterministic scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fern-simulation-${{ matrix.os }}
          path: |
            fern-simulation.json
            fern-actor-simulation.json
            fern-simulation.stderr.log
            fern-actor-simulation.stderr.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify the separate compiler benchmark lockfile
        run: cargo metadata --manifest-path benchmarks/compiler-phases/Cargo.toml --locked --format-version=1 > /dev/null
      - name: Verify the separate network codec benchmark
        run: |
          cargo test --manifest-path benchmarks/network-codecs/Cargo.toml --locked
          cargo clippy --manifest-path benchmarks/network-codecs/Cargo.toml --all-targets --locked -- -D warnings

  web-preview:
    name: Static Linux server and real browser
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      FERN_WEB_TARGET: x86_64-unknown-linux-musl
      FERN_BROWSER: /usr/bin/google-chrome
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.1
          install: true
      - name: Install browser build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          rustup target add wasm32-unknown-unknown x86_64-unknown-linux-musl
          cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - name: Lint browser and offline worker on their real target
        run: cargo clippy -p fern-browser -p fern-browser-worker --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Build self-contained static Linux executable
        run: cargo xtask web-build
      - name: Exercise two browsers and offline reload
        env:
          FERN_WEB_SCREENSHOT: dist/browser-desktop.png
          FERN_WEB_MOBILE_SCREENSHOT: dist/browser-mobile.png
        run: cargo xtask web-check dist/fern-web-linux-x86_64
      - name: Retain preview and browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: fern-web-linux-x86_64
          path: dist/
          retention-days: 7

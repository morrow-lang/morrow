name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  thread-sanitizer:
    name: ThreadSanitizer (runtime)
    runs-on: ubuntu-latest
    # The instrumented runtime suite takes about 40 minutes on an Apple M4 and
    # rebuilds the standard library from source before it starts.
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.1
          install: true
      - name: Add the standard library source the instrumented build rebuilds
        run: rustup component add rust-src
      - name: Run the runtime suite under ThreadSanitizer
        run: cargo xtask tsan
  rust-workspace:
    name: Rust workspace (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.1
          install: true
      - name: Check compiler, runtime, tooling and native programs
        run: cargo xtask check
      - name: Simulate and replay a month of application virtual time
        run: |
          cargo xtask simulate --seed 0xc0ffee --steps 3000 --days 30 --json > morrow-simulation.json 2> morrow-simulation.stderr.log
          cargo xtask simulate --replay morrow-simulation.json
          cargo xtask simulate --actors --seed 0xc0ffee --steps 5000 --json > morrow-actor-simulation.json 2> morrow-actor-simulation.stderr.log
          cargo xtask simulate --replay morrow-actor-simulation.json
      - name: Retain deterministic scenario evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morrow-simulation-${{ matrix.os }}
          path: |
            morrow-simulation.json
            morrow-actor-simulation.json
            morrow-simulation.stderr.log
            morrow-actor-simulation.stderr.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify the separate compiler benchmark lockfile
        run: cargo metadata --manifest-path benchmarks/compiler-phases/Cargo.toml --locked --format-version=1 > /dev/null
      - name: Verify the separate network codec benchmark
        run: |
          cargo test --manifest-path benchmarks/network-codecs/Cargo.toml --locked
          cargo clippy --manifest-path benchmarks/network-codecs/Cargo.toml --all-targets --locked -- -D warnings

      - name: Verify measured native message paths
        run: |
          cargo test --manifest-path benchmarks/message-path/Cargo.toml --target-dir target --locked
          cargo clippy --manifest-path benchmarks/message-path/Cargo.toml --target-dir target --all-targets --locked -- -D warnings
      - name: Install comparison runtime
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Verify language comparison oracles and developer diagnostics
        run: |
          mkdir -p "$RUNNER_TEMP/morrow-typescript"
          bun add --cwd "$RUNNER_TEMP/morrow-typescript" --exact typescript@6.0.2
          rustc --edition=2024 -Dwarnings benchmarks/language-comparison/src/main.rs -o "$RUNNER_TEMP/morrow-language-runner"
          rustc --edition=2024 -Dwarnings benchmarks/language-comparison/src/immutable.rs -o "$RUNNER_TEMP/morrow-immutable-runner"
          rustc --edition=2024 -Dwarnings benchmarks/language-comparison/src/codegen.rs -o "$RUNNER_TEMP/morrow-codegen-runner"
          rustc --edition=2024 -Dwarnings benchmarks/language-comparison/src/beam.rs -o "$RUNNER_TEMP/morrow-beam-runner"
          rustc --edition=2024 --test -Dwarnings benchmarks/language-comparison/src/beam.rs -o "$RUNNER_TEMP/morrow-beam-oracles"
          "$RUNNER_TEMP/morrow-beam-oracles"
          rustc --edition=2024 --test benchmarks/language-comparison/src/codegen.rs -o "$RUNNER_TEMP/morrow-codegen-oracles"
          "$RUNNER_TEMP/morrow-codegen-oracles"
          rustc --edition=2024 --test benchmarks/language-comparison/src/oracle.rs -o "$RUNNER_TEMP/morrow-language-oracles"
          "$RUNNER_TEMP/morrow-language-oracles"
          export MORROW="$PWD/bin/morrow"
          export MORROW_RUNTIME_LIB="$PWD/bin/libmorrow_runtime.a"
          export BUN="$(command -v bun)"
          export TSC="$RUNNER_TEMP/morrow-typescript/node_modules/typescript/bin/tsc"
          "$RUNNER_TEMP/morrow-language-runner" prepare "$RUNNER_TEMP/morrow-language-results"
          "$RUNNER_TEMP/morrow-language-runner" verify "$RUNNER_TEMP/morrow-language-results"

  beam-comparison:
    name: Elixir comparison correctness
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pinned Elixir and OTP
        uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: '29.0.6'
          elixir-version: '1.20.4-otp-29'
          version-type: strict
          install-hex: false
          install-rebar: false
      - name: Check the comparator against independent mathematical oracles
        run: |
          mkdir "$RUNNER_TEMP/morrow-beam-modules"
          elixirc --warnings-as-errors -o "$RUNNER_TEMP/morrow-beam-modules" benchmarks/language-comparison/programs/workloads.ex
          elixir -pa "$RUNNER_TEMP/morrow-beam-modules" -e 'MorrowComparison.main()' -- verify

  web-preview:
    name: Static Linux server and real browser
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      MORROW_WEB_TARGET: x86_64-unknown-linux-musl
      MORROW_BROWSER: /usr/bin/google-chrome
      CC_x86_64_unknown_linux_musl: musl-gcc
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          version: 2026.9.1
          install: true
      - name: Install browser build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
          rustup target add wasm32-unknown-unknown x86_64-unknown-linux-musl
          cargo install wasm-bindgen-cli --version 0.2.128 --locked
      - name: Lint browser and offline worker on their real target
        run: cargo clippy -p morrow-browser -p morrow-browser-worker --target wasm32-unknown-unknown --locked -- -D warnings
      - name: Build self-contained static Linux executable
        run: cargo xtask web-build
      - name: Exercise two browsers and offline reload
        env:
          MORROW_WEB_SCREENSHOT: dist/browser-desktop.png
          MORROW_WEB_MOBILE_SCREENSHOT: dist/browser-mobile.png
        run: cargo xtask web-check dist/morrow-web-linux-x86_64
      - name: Retain preview and browser evidence
        uses: actions/upload-artifact@v4
        with:
          name: morrow-web-linux-x86_64
          path: dist/
          retention-days: 7

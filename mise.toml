# Cargo is the build system; mise supplies the pinned Rust toolchain and shortcuts.
min_version = "2026.9.1"

[tools]
rust = { version = "nightly-2026-09-06", profile = "minimal", components = ["rustfmt", "clippy", "rust-src"] }

[tool_config]
locked = true

[tasks.default]
run = "cargo xtask help"

[tasks.debug]
run = "cargo xtask build"

[tasks.release]
run = "cargo xtask build --release"

[tasks.check]
run = "cargo xtask check"

[tasks.test]
run = "cargo xtask test"

[tasks.fmt]
run = "cargo xtask fmt"

[tasks.lint]
run = "cargo xtask lint"

[tasks.test-examples]
run = "cargo xtask examples"

[tasks.test-native]
run = "cargo xtask native"

[tasks.package]
run = "cargo xtask package"

[tasks.rust-check]
run = "cargo xtask check"

[tasks.rust-bench-smoke]
run = [
  "cargo fmt --manifest-path benchmarks/compiler-phases/Cargo.toml --all -- --check",
  "cargo test --manifest-path benchmarks/compiler-phases/Cargo.toml --locked",
  "cargo clippy --manifest-path benchmarks/compiler-phases/Cargo.toml --locked --all-targets -- -D warnings",
  "cargo bench --manifest-path benchmarks/compiler-phases/Cargo.toml --locked --bench phases -- --test",
]

[tasks.rust-bench]
run = "cargo bench --manifest-path benchmarks/compiler-phases/Cargo.toml --locked --bench phases"

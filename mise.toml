# Decision106: mise is the project task and tool environment entrypoint.
min_version = "2026.9.1"

[tools]
rust = { version = "nightly-2026-09-06", profile = "minimal", components = [
  "rustfmt",
  "clippy",
  "rust-src",
] }
python = "3.14.7"
uv = "0.12.5"

[env]
UV_PYTHON = "3.14.7"
UV_PYTHON_DOWNLOADS = "never"

[settings]
jobs = 1

[tool_config]
locked = true

[task_config]
shell = "bash -euo pipefail -c"

[tasks.default]
description = "Fern default"
run = '''
mise tasks ls
'''

[tasks._build-fern]
description = "Fern _build fern"
hide = true
raw_args = true
run = '''
bash scripts/tasks/build-fern
'''

[tasks._build-runtime]
description = "Fern _build runtime"
hide = true
raw_args = true
run = '''
bash scripts/tasks/build-runtime
'''

[tasks._build-test-runner]
description = "Fern _build test runner"
hide = true
raw_args = true
run = '''
bash scripts/tasks/build-test-runner
'''

[tasks._build-fuzz-runner]
description = "Fern _build fuzz runner"
hide = true
raw_args = true
run = '''
bash scripts/tasks/build-fuzz-runner
'''

[tasks.debug]
description = "Fern debug"
run = '''
mise run _build-fern debug
mise run _build-runtime debug
'''

[tasks.release]
description = "Fern release"
run = '''
mise run clean
mise run _build-fern release
mise run _build-runtime release
'''

[tasks.runtime-lib]
description = "Fern runtime lib"
run = '''
mise run _build-runtime debug
'''

[tasks.test]
description = "Fern test"
depends = ["debug"]
run = '''
mise run _build-test-runner debug
echo "Running tests..."
./bin/test_runner
python3 tests/integration/test_installation.py
python3 scripts/test_user_workflows.py
python3 scripts/test_tui.py
python3 scripts/test_runtime_process.py
python3 scripts/test_runtime_repeat.py
python3 scripts/test_runtime_access.py
python3 scripts/test_runtime_regex.py
python3 scripts/test_runtime_utf8.py
python3 scripts/test_runtime_actor_subtree.py
python3 scripts/test_runtime_managed.py
python3 scripts/test_runtime_directory.py --c-only
python3 scripts/test_string_codegen.py
python3 tests/integration/test_print_types.py
python3 scripts/test_release_workflow.py
'''

[tasks.test-user-workflows]
description = "Fern test user workflows"
depends = ["debug"]
run = '''
python3 scripts/test_user_workflows.py
'''

[tasks.fuzz-bin]
description = "Fern fuzz bin"
depends = ["debug"]
run = '''
mise run _build-fuzz-runner debug
'''

[tasks.clean]
description = "Fern clean"
run = '''
rm -rf build bin build_qbe_*.o
echo "✓ Cleaned build artifacts"
'''

[tasks.install]
description = "Fern install"
depends = ["release"]
run = '''
install -d "${DESTDIR-}${PREFIX-/usr/local}/bin"
install -m 755 bin/fern "${DESTDIR-}${PREFIX-/usr/local}/bin/fern"
install -m 644 bin/libfern_runtime.a "${DESTDIR-}${PREFIX-/usr/local}/bin/libfern_runtime.a"
echo "✓ Installed fern and runtime to ${DESTDIR-}${PREFIX-/usr/local}/bin"
'''

[tasks.uninstall]
description = "Fern uninstall"
run = '''
rm -f "${DESTDIR-}${PREFIX-/usr/local}/bin/fern" "${DESTDIR-}${PREFIX-/usr/local}/bin/libfern_runtime.a"
echo "✓ Uninstalled fern"
'''

[tasks.memcheck]
description = "Fern memcheck"
depends = ["debug"]
run = '''
valgrind --leak-check=full --show-leak-kinds=all --track-origins=yes ./bin/fern
'''

[tasks.fmt]
description = "Fern fmt"
run = '''
clang-format -i src/*.c include/*.h tests/*.c
'''

[tasks.check]
description = "Fern check"
run = '''
./scripts/check_style src lib
python3 scripts/test_style_default.py
python3 scripts/test_qbe_apple_registers.py
python3 scripts/test_native_test_supervisor.py
python3 scripts/test_c_int64.py
python3 scripts/test_process_frontends.py --compiler bin/fern
python3 scripts/test_stderr_frontends.py --compiler bin/fern
python3 scripts/test_file_text_frontends.py --compiler bin/fern
python3 scripts/generate_decimal_tables.py --check
python3 scripts/test_decimal_generator.py
python3 scripts/test_decimal_frontends.py --compiler bin/fern --c
FERN_STYLE_TOOL_PATH="$PATH" uv run --locked scripts/test_style_workflow.py --native "$PWD/scripts/check_style"
'''

[tasks.style]
description = "Fern style"
run = '''
./scripts/check_style --style-only src lib
'''

[tasks.style-lenient]
description = "Fern style lenient"
run = '''
./scripts/check_style --style-only --lenient src lib
'''

[tasks.style-fern]
description = "Fern style fern"
depends = ["debug"]
run = '''
./bin/fern run scripts/check_style.fn
'''

[tasks.style-parity]
description = "Fern style parity"
depends = ["debug"]
run = '''
uv run --locked scripts/test_style_parity.py
uv run --locked scripts/test_style_workflow.py
./scripts/check_style --help > /dev/null
FERN_STYLE_TOOL_PATH="$PATH" uv run --locked scripts/test_style_parity.py --native "$PWD/scripts/check_style"
FERN_STYLE_TOOL_PATH="$PATH" uv run --locked scripts/test_style_workflow.py --native "$PWD/scripts/check_style"
'''

[tasks.style-launcher-check]
description = "Fern style launcher check"
depends = ["debug"]
run = '''
./bin/fern build scripts/check_style.fn -o bin/check_style
python3 scripts/test_style_default.py
python3 scripts/test_style_supervisor.py
python3 scripts/test_style_foreground.py
python3 scripts/test_style_launch_control.py
python3 scripts/test_style_protocol_files.py
python3 scripts/test_style_inventory.py
python3 scripts/test_style_cache_marker.py
python3 scripts/test_style_cache_ownership.py
python3 scripts/test_style_retain.py
python3 scripts/test_style_tool_identity.py
python3 scripts/test_style_cache_early.py
python3 scripts/test_style_launcher.py
python3 scripts/test_style_cache.py
python3 scripts/test_style_cache_defaults.py
python3 scripts/test_style_cache_external.py
python3 scripts/test_style_cache_retry.py
python3 scripts/test_style_cache_concurrent.py
python3 scripts/test_style_driver_profile.py
python3 scripts/test_style_config_locations.py
'''

[tasks.pre-commit]
description = "Fern pre commit"
run = '''
./scripts/check_style --pre-commit src lib
'''

[tasks.test-examples]
description = "Fern test examples"
depends = ["debug"]
run = '''
echo "Testing examples..."
failed=0
for f in examples/*.fn; do
  name="$(basename "$f")"
  printf "  %-30s" "$name"
  if ./bin/fern check "$f" > /dev/null 2>&1; then
    echo "✓ PASS"
  else
    echo "✗ FAIL"
    ./bin/fern check "$f" 2>&1 | head -5
    failed=1
  fi
done
if [[ "$failed" -eq 1 ]]; then
  echo
  echo "Some examples failed type checking!"
  exit 1
fi
echo
echo "✓ All examples type check!"
'''

[tasks.test-doc]
description = "Fern test doc"
depends = ["debug"]
run = '''
python3 scripts/run_doc_tests.py ${DOC_TEST_FLAGS:-}
'''

[tasks.docs]
description = "Fern docs"
run = '''
python3 scripts/generate_unified_docs.py ${DOC_FLAGS:-}
'''

[tasks.docs-consistency]
description = "Fern docs consistency"
run = '''
python3 scripts/check_docs_consistency.py ${DOCS_CONSISTENCY_FLAGS:-}
'''

[tasks.docs-check]
description = "Fern docs check"
depends = ["debug"]
run = '''
mise run docs-consistency
python3 scripts/generate_unified_docs.py --check ${DOC_FLAGS:-}
python3 scripts/run_doc_tests.py ${DOC_TEST_FLAGS:-}
'''

[tasks.fuzz]
description = "Fern fuzz"
depends = ["fuzz-bin"]
run = '''
iters="${ITERS:-512}"
seed="${SEED:-$(date +%s)}"
./bin/fuzz_runner --iterations "$iters" --seed "$seed" --fern-bin ./bin/fern
'''

[tasks.fuzz-smoke]
description = "Fern fuzz smoke"
depends = ["fuzz-bin"]
run = '''
iters="${ITERS:-64}"
seed="${SEED:-0xC0FFEE}"
./bin/fuzz_runner --iterations "$iters" --seed "$seed" --fern-bin ./bin/fern
'''

[tasks.fuzz-forever]
description = "Fern fuzz forever"
depends = ["fuzz-bin"]
run = '''
iters="${ITERS:-256}"
while true; do
  seed="$(date +%s)"
  echo "== FernFuzz run (seed=$seed, iterations=$iters) =="
  ./bin/fuzz_runner --iterations "$iters" --seed "$seed" --fern-bin ./bin/fern
done
'''

[tasks.perf-budget]
description = "Fern perf budget"
run = '''
python3 scripts/check_perf_budget.py ${PERF_BUDGET_FLAGS:-}
'''

[tasks.release-policy-check]
description = "Fern release policy check"
run = '''
python3 scripts/check_release_policy.py ${RELEASE_POLICY_DOC:-docs/COMPATIBILITY_POLICY.md}
'''

[tasks.benchmark-report]
description = "Fern benchmark report"
run = '''
python3 scripts/publish_benchmarks.py ${BENCHMARK_FLAGS:-}
'''

[tasks.release-package]
description = "Fern release package"
depends = ["release"]
run = '''
version="$(awk -F'"' '/^#define FERN_VERSION_STRING / {print $2; exit}' include/version.h)"
rm -rf dist/staging
mkdir -p dist/staging/docs
cp bin/fern dist/staging/fern
cp bin/libfern_runtime.a dist/staging/libfern_runtime.a
cp LICENSE dist/staging/LICENSE
cp README.md dist/staging/README.md
cp docs/COMPATIBILITY_POLICY.md dist/staging/docs/COMPATIBILITY_POLICY.md
python3 scripts/package_release.py package \
  --version "$version" \
  --staging dist/staging \
  --out-dir dist
'''

[tasks.release-package-check]
description = "Fern release package check"
run = '''
rm -rf dist/staging
mkdir -p dist/staging/docs
cp bin/fern dist/staging/fern
cp bin/libfern_runtime.a dist/staging/libfern_runtime.a
cp LICENSE dist/staging/LICENSE
cp README.md dist/staging/README.md
cp docs/COMPATIBILITY_POLICY.md dist/staging/docs/COMPATIBILITY_POLICY.md
python3 scripts/package_release.py verify-layout --staging dist/staging
'''

[tasks.lsp-rpc-smoke]
description = "Fern lsp rpc smoke"
depends = ["debug"]
run = '''
python3 scripts/lsp_rpc_smoke.py
'''

[tasks.editor-support]
description = "Fern editor support"
run = '''
echo "Generating editor support files..."
python3 scripts/generate_editor_support.py
echo "✓ Editor support files regenerated"
echo
echo "To compile Tree-sitter grammar to WASM:"
echo "  mise run editor-support-compile"
'''

[tasks.editor-support-compile]
description = "Fern editor support compile"
depends = ["editor-support"]
run = '''
python3 scripts/test_editor_support.py --update
'''

[tasks.editor-support-check]
description = "Fern editor support check"
run = '''
python3 scripts/test_editor_support.py
'''

[tasks.help]
description = "Fern help"
run = '''
mise tasks ls
'''

[tasks._build-rust-backend]
description = "Fern _build rust backend"
hide = true
run = "bash scripts/tasks/build-rust-backend"

[tasks.rust-build]
description = "Fern rust build"
depends = ["debug"]
run = '''
mise run _build-rust-backend
cargo build --locked --manifest-path compiler-rs/Cargo.toml
cp compiler-rs/target/debug/fern-rs bin/fern-rs
'''

[tasks.rust-cranelift-build]
description = "Build the experimental Cranelift compiler alongside the QBE compiler"
depends = ["debug"]
run = '''
mise run _build-rust-backend
cargo build --locked --manifest-path compiler-rs/Cargo.toml --features cranelift
cp compiler-rs/target/debug/fern-rs bin/fern-rs-cranelift
'''

[tasks.rust-cranelift-check]
description = "Check the Cranelift feature and independent native backend corpus"
depends = ["rust-cranelift-build"]
run = '''
mise run rust-fmt
cargo clippy --locked --manifest-path compiler-rs/Cargo.toml --all-targets --features cranelift -- -D warnings
cargo test --locked --manifest-path compiler-rs/Cargo.toml --features cranelift
python3 scripts/test_cranelift_backend.py --compiler bin/fern-rs-cranelift
'''

[tasks.zed-extension-check]
description = "Fern zed extension check"
run = '''
RUSTUP_TOOLCHAIN=1.97.1 python3 scripts/test_zed_support.py --grammar-repository . --cargo "$FERN_ZED_CARGO" --wasi-sdk "$TREE_SITTER_WASI_SDK_PATH" --tree-sitter "$TREE_SITTER_CLI" --web-runtime "$TREE_SITTER_WEB_RUNTIME" --wasm-tools "$FERN_WASM_TOOLS" --rust "${FERN_RUST:-compiler-rs/target/debug/fern-rs}"
'''

[tasks.zed-package]
description = "Fern zed package"
run = '''
RUSTUP_TOOLCHAIN=1.97.1 python3 scripts/package_zed.py --output "$FERN_ZED_OUTPUT" --grammar-repository . --cargo "$FERN_ZED_CARGO" --wasi-sdk "$TREE_SITTER_WASI_SDK_PATH" --tree-sitter "$TREE_SITTER_CLI" --web-runtime "$TREE_SITTER_WEB_RUNTIME" --wasm-tools "$FERN_WASM_TOOLS"
'''

[tasks.rust-check]
description = "Fern rust check"
depends = ["rust-build"]
run = '''
python3 scripts/test_qbe_apple_registers.py
python3 scripts/test_native_test_supervisor.py
mise run rust-fmt
mise run rust-compile-check
cargo clippy --locked --manifest-path compiler-rs/Cargo.toml --all-targets -- -D warnings
cargo test --locked --manifest-path compiler-rs/Cargo.toml
python3 scripts/test_evaluate_rust_frontend.py
python3 scripts/test_rust_frontend.py
python3 scripts/test_rust_collections.py
python3 scripts/test_rust_types.py
python3 scripts/test_rust_closures.py
python3 scripts/test_rust_maps.py
python3 scripts/test_rust_control.py
python3 scripts/test_rust_iteration.py
python3 scripts/test_rust_numeric.py
python3 scripts/test_rust_boundaries.py
python3 scripts/test_rust_sequences.py
python3 scripts/test_rust_functions.py
python3 scripts/test_rust_parameters.py
python3 scripts/test_rust_generic_schemes.py
python3 scripts/test_rust_whole_signatures.py
python3 scripts/test_rust_inference_shapes.py
python3 scripts/test_rust_newtypes.py
python3 scripts/test_rust_aliases.py
python3 scripts/test_rust_namespaces.py
python3 scripts/test_rust_labels.py
python3 scripts/test_rust_unions.py
python3 scripts/test_rust_global_identity.py
python3 scripts/test_rust_stdlib.py
python3 scripts/test_rust_actors.py
python3 scripts/test_rust_json.py
python3 scripts/test_rust_json_codecs.py
python3 scripts/test_rust_doctests.py
python3 scripts/test_rust_units.py
python3 scripts/test_package_rust_preview.py
python3 scripts/test_rust_preview.py --compiler compiler-rs/target/debug/fern-rs --qbe bin/fern-qbe --supervisor bin/fern-test-supervisor --runtime bin/libfern_runtime.a
uv run --locked scripts/test_style_parity.py --compiler compiler-rs/target/debug/fern-rs
uv run --locked scripts/test_style_workflow.py --compiler compiler-rs/target/debug/fern-rs
python3 scripts/test_runtime_actor_subtree.py
python3 scripts/test_runtime_managed.py
python3 scripts/test_runtime_directory.py
python3 scripts/test_runtime_file_text.py
python3 scripts/test_file_text_frontends.py
python3 scripts/generate_decimal_tables.py --check
python3 scripts/test_decimal_generator.py
python3 scripts/test_runtime_decimal.py
python3 scripts/test_decimal_frontends.py
python3 scripts/test_runtime_stderr.py
python3 scripts/test_stderr_frontends.py --compiler compiler-rs/target/debug/fern-rs
python3 scripts/test_runtime_process_bounded.py
python3 scripts/test_process_frontends.py --compiler compiler-rs/target/debug/fern-rs
python3 scripts/test_runtime_json.py
python3 scripts/test_runtime_json_codecs.py
python3 scripts/test_rust_fuzz.py
'''

[tasks.rust-release]
description = "Fern rust release"
depends = ["release"]
run = '''
mise run _build-rust-backend
cargo build --locked --release --manifest-path compiler-rs/Cargo.toml
cp compiler-rs/target/release/fern-rs bin/fern-rs
'''

[tasks.rust-evaluate]
description = "Fern rust evaluate"
depends = ["rust-release"]
run = '''
python3 scripts/evaluate_rust_frontend.py --output build/rust-frontend-evaluation.json
'''

[tasks.rust-fmt]
description = "rust fmt"
run = "cargo fmt --all --manifest-path compiler-rs/Cargo.toml -- --check"

[tasks.rust-compile-check]
description = "rust compile check"
run = "cargo check --locked --manifest-path compiler-rs/Cargo.toml --all-targets --all-features"

[tasks.rust-clippy]
description = "rust clippy"
run = "cargo clippy --locked --manifest-path compiler-rs/Cargo.toml --all-targets --all-features -- -D warnings"

[tasks.rust-test]
description = "rust test"
run = "cargo test --locked --manifest-path compiler-rs/Cargo.toml --all-features"

[tasks.rust-doc-test]
description = "rust doc test"
run = "cargo test --locked --manifest-path compiler-rs/Cargo.toml --doc"

[tasks.tool-versions]
description = "tool versions"
run = "python3 scripts/check_tool_versions.py"

[tasks.mise-workflow-check]
description = "mise workflow check"
run = [
  "python3 scripts/test_mise_workflow.py",
  "python3 scripts/test_python_locks.py",
  "python3 scripts/test_build_flags.py",
]

[tasks.rust-nextest]
description = "Optional bounded parallel tests with a prebuilt runner; run rust-doc-test separately"
tools = { "aqua:nextest-rs/nextest/cargo-nextest" = "0.9.143" }
run = "cargo nextest run --locked --manifest-path compiler-rs/Cargo.toml --all-features"

[tasks.rust-watch]
description = "Optional queued compile feedback; never runs Fern programs or changes dependencies"
tools = { watchexec = "2.7.1" }
run = "watchexec --project-origin . --shell=none --watch compiler-rs/src --watch compiler-rs/tests --watch compiler-rs/Cargo.toml --exts rs,toml --debounce 500ms --on-busy-update queue -- mise run rust-compile-check"

[tasks.rust-bacon-install]
description = "Opt-in local Bacon build using a separate modern compiler; Fern jobs use the pinned nightly"
tools = { rust = "1.98.1" }
run = "cargo install --locked --version 3.25.0 --root compiler-rs/target/dev-tools/bacon-3.25.0 bacon"

[tasks.rust-bacon]
description = "Optional Bacon UI with pinned-nightly check/clippy jobs; install once with rust-bacon-install"
raw_args = true
run = "bash scripts/tasks/bacon"

[tasks.rust-lint-policy]
description = "Verify production and boundary lints with real rejected Rust fixtures"
run = "python3 scripts/test_rust_lint_policy.py"

[tasks.rust-bench-smoke]
description = "Verify phase benchmark fixtures, formatting, Clippy and executable measurements"
run = [
  "cargo fmt --manifest-path benchmarks/compiler-phases/Cargo.toml --all -- --check",
  "cargo test --manifest-path benchmarks/compiler-phases/Cargo.toml --locked",
  "cargo clippy --manifest-path benchmarks/compiler-phases/Cargo.toml --locked --all-targets -- -D warnings",
  "cargo bench --manifest-path benchmarks/compiler-phases/Cargo.toml --locked --bench phases -- --test",
]

[tasks.rust-bench]
description = "Measure compiler phases statistically; compare on an otherwise quiet host"
run = "cargo bench --manifest-path benchmarks/compiler-phases/Cargo.toml --locked --bench phases"

[tasks.rust-preview-stage]
description = "Stage an opt-in Rust preview from explicit immutable built inputs"
run = '''
python3 scripts/package_rust_preview.py stage \
  --compiler "${FERN_PREVIEW_COMPILER:?set the built fern-rs path}" \
  --qbe "${FERN_PREVIEW_QBE:?set the built fern-qbe path}" \
  --supervisor "${FERN_PREVIEW_SUPERVISOR:?set the built supervisor path}" \
  --runtime "${FERN_PREVIEW_RUNTIME:?set the built runtime archive path}" \
  --license LICENSE --version "${FERN_PREVIEW_VERSION:?set preview version}" \
  --os "${FERN_PREVIEW_OS:?set linux or macos}" --arch "${FERN_PREVIEW_ARCH:?set arm64 or x86_64}" \
  --output "${FERN_PREVIEW_STAGE:?set a new staging directory}"
'''

[tasks.rust-preview-package]
description = "Atomically package a verified opt-in Rust preview"
run = '''
python3 scripts/package_rust_preview.py package \
  --staging "${FERN_PREVIEW_STAGE:?set an existing preview stage}" \
  --output "${FERN_PREVIEW_ARCHIVE:?set archive output path}"
'''

[tasks.rust-preview-verify]
description = "Verify the exact bounded Rust preview archive without extraction"
run = '''
python3 scripts/package_rust_preview.py verify "${FERN_PREVIEW_ARCHIVE:?set archive path}"
'''

[tasks.rust-preview-check]
description = "Test preview packaging, hostile archives and literal task paths without builds"
run = "python3 scripts/test_package_rust_preview.py"

[tasks.rust-preview-smoke]
description = "Move and exercise a Rust preview using explicit already-built inputs"
run = '''
python3 scripts/test_rust_preview.py \
  --compiler "${FERN_PREVIEW_COMPILER:?set the built fern-rs path}" \
  --qbe "${FERN_PREVIEW_QBE:?set the built fern-qbe path}" \
  --supervisor "${FERN_PREVIEW_SUPERVISOR:?set the built supervisor path}" \
  --runtime "${FERN_PREVIEW_RUNTIME:?set the built runtime archive path}"
'''

[package]
name = "fern-prototype"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
publish = false

[features]
default = []
cranelift = ["dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-module", "dep:cranelift-object", "dep:cranelift-native"]

# Decision112: explicit supported backend pins; Cargo.lock fixes transitive inputs.
[dependencies]
cranelift-codegen = { version = "=0.135.1", optional = true }
cranelift-frontend = { version = "=0.135.1", optional = true }
cranelift-module = { version = "=0.135.1", optional = true }
cranelift-object = { version = "=0.135.1", optional = true }
cranelift-native = { version = "=0.135.1", optional = true }
rustyline = { version = "=18.0.1", default-features = false, features = ["with-file-history"] }

[lib]
name = "fern_prototype"
path = "src/lib.rs"

[[bin]]
name = "fern-rs"
path = "src/main.rs"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1

# Decision107: strict supported lints, expanded only after auditing existing invariants.
[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"
unchecked_time_subtraction = "deny"
unused_peekable = "deny"
redundant_clone = "deny"
or_fun_call = "deny"

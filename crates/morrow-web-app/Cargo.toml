[package]
name = "morrow-web-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
simulation = ["morrow-runtime/simulation"]

[dependencies]
morrow-runtime = { path = "../morrow-runtime", default-features = false }
morrow-web-protocol = { path = "../morrow-web-protocol" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
libc.workspace = true

[build-dependencies]
ar_archive_writer = "=0.5.2"
morrow = { path = "../morrow" }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[package]
name = "fern"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Decision112: explicit supported backend pins; Cargo.lock fixes transitive inputs.
[dependencies]
fern-test-supervisor = { path = "../fern-test-supervisor" }
fern-json = { path = "../fern-json" }
cranelift-codegen = { version = "=0.135.1" }
cranelift-frontend = { version = "=0.135.1" }
cranelift-module = { version = "=0.135.1" }
cranelift-object = { version = "=0.135.1" }
cranelift-native = { version = "=0.135.1" }
rustyline = { version = "=18.0.1", default-features = false, features = ["with-file-history"] }

[dev-dependencies]
serde_json = "=1.0.151"
libc.workspace = true

[lib]
name = "fern_compiler"
path = "src/lib.rs"

[[bin]]
name = "fern"
path = "src/main.rs"

# Decision107: strict supported lints, expanded only after auditing existing invariants.
[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"
unchecked_time_subtraction = "deny"
unused_peekable = "deny"
redundant_clone = "deny"
or_fun_call = "deny"

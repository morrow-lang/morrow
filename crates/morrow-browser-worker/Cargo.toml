[package]
name = "morrow-browser-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
js-sys = "=0.3.105"
web-sys = { version = "=0.3.105", features = ["Cache", "CacheStorage", "Clients", "Event", "EventTarget", "ExtendableEvent", "FetchEvent", "Request", "RequestInit", "RequestCache", "Response", "ServiceWorkerGlobalScope", "Url", "WorkerLocation"] }

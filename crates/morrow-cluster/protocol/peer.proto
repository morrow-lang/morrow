syntax = "proto3";
package morrow.peer.v1;

// Strict Morrow profile: scalar presence is required where listed in the registry.
// Outer Hello/Frame duplicate/unknown fields and overlong varints are rejected.
// Nested command/event bytes follow the live decoder's bounded protobuf profile,
// which permits nonminimal varints. Neither layer uses raw bytes as identity.
// ALPN: morrow.peer.protobuf.v1. Hello.version = 2.
message Hello {
  optional uint32 version = 1;
  optional string cluster = 2;
  optional string node = 3;
  optional bytes boot = 4;       // Exactly 16 bytes, not all zero.
  optional bytes link = 5;       // Exactly 16 bytes, not all zero.
  optional bytes manifest = 6;   // Exactly 32 bytes.
}

message Frame {
  optional uint32 kind = 1;      // Join=1 Command=2 Event=3 Ping=4 Pong=5 Close=6.
  optional string room = 2;
  optional uint32 lease_ms = 3;
  optional bytes command = 4;    // Strict morrow-web-protocol binary Command.
  optional bytes event = 5;      // Strict morrow-web-protocol binary server envelope.
  optional uint64 nonce = 6;
}

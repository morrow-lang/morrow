[package]
name = "morrow-cluster"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.11.0"
morrow-web-protocol = { path = "../morrow-web-protocol" }
rustls = { version = "=0.23.44", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "=0.26.5", default-features = false, features = ["ring"] }
tokio = { version = "=1.53.1", features = ["net", "io-util", "sync", "time", "rt", "macros"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["ring", "crypto"] }
rustix = { version = "=1.1.4", features = ["fs"] }
zeroize = "=1.9.0"
[dev-dependencies]
tokio = { version = "=1.53.1", features = ["test-util"] }

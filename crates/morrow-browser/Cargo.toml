[package]
name = "morrow-browser"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
morrow-web-protocol = { path = "../morrow-web-protocol" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
js-sys = "=0.3.105"
web-sys = { version = "=0.3.105", features = ["Window", "Document", "Element", "HtmlElement", "HtmlInputElement", "HtmlButtonElement", "Node", "Event", "EventTarget", "MessageEvent", "CloseEvent", "WebSocket", "BinaryType", "Location", "Storage", "Response", "Request", "RequestInit", "RequestCredentials", "Headers", "Navigator", "ServiceWorkerContainer", "AbortController", "AbortSignal"] }

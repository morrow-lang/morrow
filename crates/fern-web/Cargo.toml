[package]
name = "fern-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal", "io-util"] }
getrandom = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
fern-web-protocol = { path = "../fern-web-protocol" }
fern-web-app = { path = "../fern-web-app" }

[build-dependencies]
libc.workspace = true

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["test-util"] }
tokio-tungstenite = "=0.30.0"
futures-util = { version = "=0.3.32", features = ["sink"] }
serde_json = "=1.0.151"
